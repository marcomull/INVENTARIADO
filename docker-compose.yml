services:
  # ------------------------------------------------------------
  # 1. CACHÉ & SESIONES: Redis
  # ------------------------------------------------------------
  redis-cache:
    image: redis:7-alpine
    container_name: inventario-redis
    restart: unless-stopped
    ports:
      - ":6379"
    volumes:
      - redis_data:/data
    networks:
      - inventario-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # 2. BACKEND: Spring Boot API
  # ------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventario-backend
    restart: unless-stopped
    ports:
      - ":8082"
    depends_on:
      redis-cache:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://:/?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: 
      DB_PASS: 
      JWT_SECRET: 
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      MAIL_HOST: 
      MAIL_PORT: 
      MAIL_USERNAME: 
      MAIL_PASSWORD: 
      SERVER_PORT: 8082
    networks:
      - inventario-network

  # ------------------------------------------------------------
  # 3. FRONTEND: React + Vite + Nginx
  # ------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventario-frontend
    restart: unless-stopped
    ports:
      - ":80"
    depends_on:
      - backend
    networks:
      - inventario-network

# ------------------------------------------------------------
# VOLÚMENES Y REDES PERSISTENTES
# ------------------------------------------------------------
volumes:
  redis_data:
    name: inventario_redis_data

networks:
  inventario-network:
    name: inventario_network
    driver: bridge
