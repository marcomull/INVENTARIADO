services:
  # ------------------------------------------------------------
  # 1. REDIS: Caché & Sesiones
  # ------------------------------------------------------------
  redis-cache:
    image: redis:7-alpine
    container_name: inventario-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - inventario-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # 2. BACKEND: Spring Boot API (Puerto 8080)
  # ------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventario-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      redis-cache:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/inventario_empresa?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: redis-cache
      JWT_SECRET: EstaEsUnaClaveSuperSeguraYDeAlMenos32Caracteres1234
      SERVER_PORT: 8080
    networks:
      - inventario-network

  # ------------------------------------------------------------
  # 3. FRONTEND: React Web App (Puerto 3000)
  # ------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventario-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - inventario-network

volumes:
  redis_data:
    name: inventario_redis_data

networks:
  inventario-network:
    name: inventario_network
    driver: bridge